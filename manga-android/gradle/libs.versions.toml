[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
haze = "2.0.1"
work = "2.12.0"
jna = "5.19.1"
coroutines = "1.11.0"
junit = "4.13.2"
json = "20260814"
testRunner = "1.7.0"
profileinstaller = "1.4.1"
testJunit = "1.3.0"
coreKtx = "1.19.1"
baselineProfile = "1.5.0"
uiautomator = "2.4.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-glass = { module = "dev.chrisbanes.haze:haze-glass", version.ref = "haze" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "baselineProfile" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
