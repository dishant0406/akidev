name: AkiManga
options:
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: live.akidev
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Akidev
    CODE_SIGNING_ALLOWED: NO
packages:
  AkiManga:
    path: Packages/AkiManga
targets:
  # Named apart from the AkiManga package so the two schemes do not collide.
  AkiMangaApp:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AkiManga
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.akidev.manga
        # iPhone only: an iPad build must support every orientation and needs its own screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sources are served over plain http only from a developer's machine (the demo server).
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Akidev
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without a launch screen iOS runs the app letterboxed instead of full screen.
        UILaunchScreen: {}
        # Only HTTPS through the system: no export-compliance questions on every upload.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch, processing, audio]
        # Lets a display link (the strip's auto-scroll) run above 60 Hz on iPhones with a ProMotion screen.
        CADisableMinimumFrameDurationOnPhone: true
        BGTaskSchedulerPermittedIdentifiers: [live.akidev.manga.refresh, live.akidev.manga.download]
        CFBundleURLTypes:
          - CFBundleURLName: live.akidev.manga
            CFBundleURLSchemes: [akimanga]
