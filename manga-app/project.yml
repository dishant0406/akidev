name: AkiManga
options:
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: live.akidev
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Akidev
    CODE_SIGNING_ALLOWED: NO
packages:
  AkiManga:
    path: Packages/AkiManga
targets:
  # Named apart from the AkiManga package so the two schemes do not collide.
  AkiMangaApp:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AkiManga
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.akidev.manga
        # iPhone and iPad: the same app. An iPad must support every orientation (and so also Split View and Slide Over).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sources are served over plain http only from a developer's machine (the demo server).
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    entitlements:
      path: App/AkiManga.entitlements
      properties:
        # Joins the temporary Wi-Fi an Android phone makes for one send. Automatic signing adds the capability to the app's ID.
        com.apple.developer.networking.HotspotConfiguration: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Akidev
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without a launch screen iOS runs the app letterboxed instead of full screen.
        UILaunchScreen: {}
        # Only HTTPS through the system: no export-compliance questions on every upload.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch, processing, audio]
        # Lets a display link (the strip's auto-scroll) run above 60 Hz on iPhones with a ProMotion screen.
        CADisableMinimumFrameDurationOnPhone: true
        BGTaskSchedulerPermittedIdentifiers: [live.akidev.manga.refresh, live.akidev.manga.download]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The Share screen finds and announces phones with Bonjour; iOS asks the person first, and says why with this line.
        NSLocalNetworkUsageDescription: Akidev uses your local network to send books and series to a friend's phone on the same Wi-Fi, and to receive from them.
        # _akidev-p2p._tcp is the direct link between two iPhones with no Wi-Fi in common.
        NSBonjourServices: [_akidev._tcp, _akidev-p2p._tcp]
        # Only asked when the person taps "Scan their code".
        NSCameraUsageDescription: Akidev uses the camera only to scan a code from a friend's phone.
        # "Open in Akidev" for a book or a comic archive (a series card never travels as a file: it arrives through the Share screen).
        # iOS hands the app a copy of the file, so nothing is opened in place (Apple asks every document app to say which: ITMS-90737).
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Comic archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [live.akidev.cbz]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: live.akidev.cbz
            UTTypeDescription: Comic book archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
        CFBundleURLTypes:
          - CFBundleURLName: live.akidev.manga
            CFBundleURLSchemes: [akimanga]
