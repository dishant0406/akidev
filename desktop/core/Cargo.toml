[package]
name = "akidev-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "akidev-sources"
path = "src/bin/sources.rs"

[features]
# YouTube Music and Audius, played by the desktop app. The server does not turn it on.
music = ["dep:ytmapi-rs", "dep:zip", "tokio/process"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zip = { version = "7", default-features = false, features = ["deflate"], optional = true }
ytmapi-rs = { path = "../vendor/ytmapi-rs", default-features = false, features = ["default-tls", "simplified-queries"], optional = true }
tracing.workspace = true
toml = "0.8"
librqbit = "9.0.1"
axum = "0.8"
tokio-util = { version = "0.7.20", features = ["io"] }
getrandom = "0.3"
ed25519-dalek = "2"
sha2 = "0.10"
