[package]
name = "akidev-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "akidev-sources"
path = "src/bin/sources.rs"

[features]
# Torrent streaming and the loopback server: desktop and server only. A phone build (the manga app) turns it off,
# because librqbit does not compile for iOS.
default = ["streaming"]
streaming = ["dep:librqbit", "dep:axum", "dep:tokio-util"]
# YouTube Music and Audius, played by the desktop app. The server does not turn it on.
music = ["dep:ytmapi-rs", "dep:zip", "tokio/process"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
regex.workspace = true
# The workspace's native TLS is the system library on Apple, Windows and Linux; Android has none, so it gets rustls.
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zip = { version = "7", default-features = false, features = ["deflate"], optional = true }
ytmapi-rs = { path = "../vendor/ytmapi-rs", default-features = false, features = ["default-tls", "simplified-queries"], optional = true }
tracing.workspace = true
toml = "0.8"
librqbit = { version = "9.0.1", optional = true }
axum = { version = "0.8", optional = true }
tokio-util = { version = "0.7.20", features = ["io"], optional = true }
getrandom = { version = "0.3", features = ["std"] }
ed25519-dalek = "2"
sha2 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
axum = "0.8"
