[package]
name = "akidev-manga-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "akimanga"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
akidev-core = { path = "../core", default-features = false }
akidev-manga = { path = "../manga" }
anyhow.workspace = true
base64 = "0.22"
# Its own version: MangaDex needs TLS 1.3, which the workspace's native-tls (macOS Security.framework 1.2) cannot speak.
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "form", "rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uniffi = { version = "0.32", features = ["cli", "tokio"] }

[dev-dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
