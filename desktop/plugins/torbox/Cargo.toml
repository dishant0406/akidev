# TorBox as a stream service plugin. It is its own workspace, so it builds for WebAssembly alone:
#   cargo build --release --target wasm32-unknown-unknown
# See README.md.

[package]
name = "torbox"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
