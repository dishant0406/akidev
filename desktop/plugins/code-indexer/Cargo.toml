# An example plugin that brings code: an indexer that signs its request and reads an HTML page.
# It is its own workspace, so it builds for WebAssembly without the app's dependencies:
#   cargo build --release --target wasm32-unknown-unknown
# See README.md for how to turn it into a plugin.

[package]
name = "code-indexer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
