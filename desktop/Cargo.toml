[workspace]
members = ["core", "party", "library", "app", "server", "manga", "manga-ffi"]
# Copies of other people's crates (see their PATCH.md): kept out of the workspace so clippy and the
# tests run on our code, not theirs.
exclude = ["vendor/ytmapi-rs", "vendor/json-crawler"]
resolver = "2"

[workspace.package]
version = "0.1.25"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
anyhow = "1"
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
tracing = "0.1"

# librqbit with one change: a read that starts, or seeks, wakes the peers that are idle. See
# vendor/librqbit/PATCH.md.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }

# What the iPhone app links: the smallest binary, since the app's size is a store figure people see. The desktop app and
# the server keep the plain release profile. See manga-app/scripts/build-ffi.sh.
[profile.ios]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

# Speech is arithmetic that must run faster than it plays, so the crates that do it are not built at "z" like the rest.
# Measured on a Mac with the same text under this profile: "z" speaks 6 times faster than real time, "s" 12 times, 3 17 times.
[profile.ios.package.ptts]
opt-level = 3
[profile.ios.package.xn]
opt-level = 3
[profile.ios.package.xn-gemm]
opt-level = 3
[profile.ios.package.xn-gemm-common]
opt-level = 3
[profile.ios.package.xn-gemm-f16]
opt-level = 3
[profile.ios.package.xn-gemm-f32]
opt-level = 3
[profile.ios.package.xn-gemm-f64]
opt-level = 3
[profile.ios.package.xn-gemm-c32]
opt-level = 3
[profile.ios.package.xn-gemm-c64]
opt-level = 3
