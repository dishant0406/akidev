[package]
name = "akidev-manga"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "akidev-manga-cli"
path = "src/bin/cli.rs"

[dependencies]
akidev-core = { path = "../core", default-features = false }
anyhow.workspace = true
ego-tree = "0.11.1"
regex.workspace = true
# Its own version: MangaDex needs TLS 1.3, which the workspace's native-tls (macOS Security.framework 1.2) cannot speak.
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "form", "rustls"] }
scraper = "0.29.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2.5.8"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
