[package]
name = "akidev-manga"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "akidev-manga-cli"
path = "src/bin/cli.rs"

[dependencies]
akidev-core = { path = "../core", default-features = false }
# AES-CBC decryption for a site that hands over an encrypted chapter list (see src/crypt.rs): the same crates
# curl/openssl-style tooling uses, not hand-written crypto.
aes = "0.8"
anyhow.workspace = true
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
ego-tree = "0.11.1"
md-5 = "0.10"
regex.workspace = true
# Its own version: MangaDex needs TLS 1.3, which the workspace's native-tls (macOS Security.framework 1.2) cannot speak.
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "form", "rustls-no-provider"] }
scraper = "0.29.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2.5.8"
# reqwest is given no crypto library of its own (the default one is a bigger C library); this is the one it uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
# The standard scrambles embedded fonts with a SHA-1 of the book's identifier (see src/book/epub.rs).
sha1 = "0.10"
ed25519-dalek = "2"
getrandom = "0.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
rusqlite = "0.32"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

# The iPhone has SQLite built in; linking it (see Packages/AkiManga/Package.swift) saves about half a megabyte over a
# copy of our own. Everywhere else the library brings its own, so tests and the CLI behave the same on any machine.
[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
