# A code plugin for an indexer: it makes the request, reads an HTML page, and answers with JSON rows.
# Rename the package after the site (lower case, dashes). It is its own workspace, so it builds alone:
#   cargo build --release --target wasm32-unknown-unknown
# Then use ../../scripts/build-plugin.sh to hash it and write the plugin.

[package]
name = "anirena"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
